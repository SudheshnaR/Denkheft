{id:'fridolin',title:'Fridolin lernt fliegen',theme:'Mut und Übung',teaser:'Ein junger Drache hat Angst vor der Höhe. Sein Grossvater kennt einen Trick.',
 parts:[
  {img:()=>PIC(D.sky('day')+D.cloud(150,30)+D.cloud(250,60,.8)+D.mountains('#93a3bb',true)+D.lake(140)+D.rock()+D.dragon(66,104,1)+D.dragon(200,64,.75,'#e0794f',1,true)+D.dragon(270,44,.6,'#6a8de0',-1,true)),
   p:['Auf einem hohen Felsen über dem Walensee wohnte der junge Drache Fridolin. Er hatte grüne Schuppen, eine lange Nase und zwei grosse Flügel. Alle Drachen in seiner Familie konnten fliegen. Sie kreisten über den Bergen und spielten Fangen mit den Wolken. Nur Fridolin blieb immer auf dem Felsen sitzen.','„Komm doch mit!“, riefen seine Schwestern. Aber Fridolin schüttelte den Kopf. Wenn er nach unten schaute, wurde ihm schwindlig. Seine Knie zitterten, und seine Flügel klebten an seinem Rücken. „Ich bin eben kein richtiger Drache“, dachte er traurig.']},
  {img:()=>PIC(D.sky('evening')+D.sun(250,120,22)+D.mountains('#7c7aa0',false)+D.lake(140)+'<path d="M40 180 L40 128 Q120 112 230 126 L250 180Z" fill="#8a8f99"/>'+D.dragon(110,130,1.25,'#3f8a6b')+D.dragon(185,132,.85,'#4fae5c',-1)),
   p:['Eines Abends setzte sich Grossvater Drache neben ihn. Er war alt und hatte schon tausend Flüge gemacht. „Weisst du“, sagte er, „als ich klein war, hatte ich auch Angst.“ Fridolin staunte. „Du? Wirklich?“','„Ja. Aber ich wollte nicht gleich vom höchsten Felsen springen. Ich habe klein angefangen. Jeden Tag ein kleines Stück.“']},
  {img:()=>PIC(D.sky('day')+D.sun(40,34)+D.hills()+D.stone(150,162,40)+D.dragon(160,128,.85,'#4fae5c',1,true)+D.dragon(250,164,.55,'#e0794f',-1)+D.dragon(285,166,.5,'#6a8de0',-1)+'<g stroke="#9aa5b4" stroke-width="1.5" stroke-linecap="round"><line x1="150" y1="138" x2="146" y2="146"/><line x1="160" y1="138" x2="160" y2="147"/></g>'),
   p:['Am nächsten Morgen suchte Fridolin einen kleinen Stein, nur so hoch wie ein Stuhl. Er breitete die Flügel aus und hüpfte hinunter. Er landete auf der Nase. Seine Schwestern kicherten, aber Grossvater nickte. „Gut gemacht! Morgen wieder.“','Fridolin übte jeden Tag. Zuerst vom Stein, dann von einem Baumstamm, dann von einem kleinen Hügel. Manchmal fiel er hin. Manchmal wollte er aufgeben. Aber jeden Tag konnte er ein bisschen länger in der Luft bleiben.']},
  {img:()=>PIC(D.sky('day')+D.cloud(40,40)+D.cloud(230,28,1.1)+D.mountains('#93a3bb',true)+D.lake(140)+D.pine(20,150,.7)+D.pine(300,150,.7)+D.dragon(150,100,1.5,'#4fae5c',1,true)),
   p:['Nach drei Wochen stand Fridolin wieder auf dem hohen Felsen. Sein Herz klopfte, aber diesmal schaute er nicht nach unten, sondern nach vorne zu den Wolken. Er breitete die Flügel aus, atmete tief ein und sprang. Der Wind trug ihn. Er flog! Er flog über den See, über die Tannen und über die Kühe auf der Alp. Seine Schwestern jubelten.','Am Abend landete er stolz neben Grossvater. „Ich hatte immer noch ein bisschen Angst“, gab er zu. Grossvater lächelte. „Mut heisst nicht, keine Angst zu haben. Mut heisst, es trotzdem zu versuchen.“']}],
 words:[['die Schuppen','kleine harte Plättchen auf der Haut von Drachen und Fischen'],['schwindlig','alles dreht sich im Kopf'],['staunen','sich sehr wundern'],['aufgeben','aufhören, weil es schwer ist'],['zugeben','ehrlich etwas über sich sagen']],
 qs:[{t:'mc',q:'Was passierte, wenn Fridolin nach unten schaute?',a:'Ihm wurde schwindlig',w:['Er musste lachen','Er schlief ein']},
  {t:'mc',q:'Wer half Fridolin?',a:'Sein Grossvater',w:['Seine Schwestern','Ein Adler']},
  {t:'rf',q:'Fridolin flog am ersten Tag gleich vom hohen Felsen.',a:false},
  {t:'rf',q:'Fridolin übte jeden Tag ein bisschen mehr.',a:true},
  {t:'order',items:['Fridolin blieb immer auf dem Felsen.','Grossvater erzählte von seiner Angst.','Fridolin hüpfte von einem kleinen Stein.','Fridolin flog über den See.']},
  {t:'word',q:'Was bedeutet „Seine Schwestern kicherten“?',a:'Sie lachten leise',w:['Sie weinten','Sie schrien laut']},
  {t:'why',q:'Warum begann Fridolin mit einem kleinen Stein?',a:'Weil man Schwieriges in kleinen Schritten lernt',w:['Weil der Felsen kaputt war','Weil seine Schwestern es befahlen']},
  {t:'gap',q:'„Mut heisst, es ___ zu versuchen.“',a:['trotzdem']},
  {t:'write',q:'Was hast du auch schon in kleinen Schritten gelernt? Schreibe einen Satz.',m:'Ich habe das Klettern in kleinen Schritten gelernt.'}]},

{id:'handschuh',title:'Der rote Handschuh',theme:'Ehrlichkeit und Freundlichkeit',teaser:'Nils findet im Schnee einen Handschuh mit einem kleinen weissen Herz.',
 parts:[
  {img:()=>PIC(D.sky('winter')+D.house(40,140,'#f3c94f',true)+D.house(282,140,'#9fc8e8',true)+D.ground('#f2f7fb',140)+D.snowflakes()+D.fountain(160,150)+D.kid(110,170,{shirt:'#3b82c4',cap:'#e5483d'})+D.kid(138,172,{shirt:'#f2b632',s:.78,cap:'#3aa36b'})+D.mitten(196,170,1.1)),
   p:['Es war ein kalter Dezembertag. Nils ging mit seinem kleinen Bruder Leo zum Bäcker. Die Strassen waren weiss, und aus den Fenstern leuchteten Sterne. Vor dem Brunnen auf dem Dorfplatz lag etwas Rotes im Schnee. Nils hob es auf. Es war ein Handschuh, gestrickt aus weicher Wolle, mit einem kleinen weissen Herz darauf.','„Der ist schön“, sagte Leo. „Nimm ihn doch mit!“ Nils drehte den Handschuh in der Hand. Er dachte nach. „Jemand hat jetzt eine kalte Hand“, sagte er. „Und vielleicht ist der Handschuh ganz wichtig für ihn.“']},
  {img:()=>PIC(D.sky('winter')+D.house(160,140,'#f3c94f',true)+D.ground('#f2f7fb',140)+D.snowflakes()+D.fountain(120,162)+D.mitten(98,132,1.2)+'<line x1="98" y1="132" x2="116" y2="128" stroke="#3b82c4" stroke-width="1.5"/>'+D.note(130,128)+D.kid(230,170,{shirt:'#3b82c4',cap:'#e5483d'})+D.kid(258,172,{shirt:'#f2b632',s:.78,cap:'#3aa36b',sad:true})),
   p:['Die beiden Brüder fragten den Bäcker. „Nein, der gehört mir nicht“, sagte er. Sie fragten eine Frau mit einem Hund und den Mann vom Kiosk. Niemand vermisste einen roten Handschuh. Leo wurde ungeduldig. „Komm, wir gehen nach Hause. Mir ist kalt.“','Doch Nils hatte eine Idee. Er band den Handschuh mit einem Band an den Brunnen, gut sichtbar. Daneben legte er einen Zettel: „Gefunden! Wir wohnen im gelben Haus Nummer 4.“']},
  {img:()=>PIC(D.wall()+D.door(120)+D.kid(145,176,{s:1.3,shirt:'#7a5a8a',hair:'#d8d8d8',glasses:true,stick:true})+D.mitten(126,124,.9)+D.kid(225,174,{shirt:'#3b82c4'})+D.kid(255,176,{shirt:'#f2b632',s:.8})),
   p:['Am Abend klingelte es. Vor der Tür stand eine alte Frau mit einem Stock. Sie trug einen roten Handschuh, nur einen. „Ich bin Frau Keller“, sagte sie. „Ich habe euren Zettel gelesen.“ Ihre Augen glänzten.','„Diese Handschuhe hat mein Mann vor vielen Jahren für mich gestrickt. Sie sind mein liebstes Andenken. Ich dachte, ich hätte einen für immer verloren.“ Nils gab ihr den Handschuh. Frau Keller drückte ihn fest an sich.']},
  {img:()=>PIC(D.wall('#f3e3c8')+'<rect x="230" y="30" width="50" height="40" fill="#cfe8ff" stroke="#a4733f" stroke-width="4"/>'+D.kid(90,140,{s:1.2,shirt:'#7a5a8a',hair:'#d8d8d8',glasses:true})+D.kid(170,136,{shirt:'#3b82c4'})+D.kid(235,138,{shirt:'#f2b632',s:.85})+D.table()+D.cup(120,128)+D.cup(200,128,'#fde2e2')+D.heartCookie(150,126)+D.heartCookie(162,128)+'<path d="M172 124 L190 108 M176 124 L196 112" stroke="#9aa5b4" stroke-width="1.6"/><path d="M174 124 q8 6 16 0" stroke="#3b82c4" stroke-width="3" fill="none"/>'),
   p:['Am nächsten Sonntag lud Frau Keller die beiden Brüder zu Tee und Lebkuchen ein. Sie zeigte ihnen, wie man strickt. Leo liess dauernd Maschen fallen und musste lachen. Nils strickte langsam einen kleinen blauen Schal.','Von da an besuchten sie Frau Keller jede Woche. Sie war nicht mehr allein, und die Jungen hatten eine neue Freundin. „Siehst du“, sagte Nils auf dem Heimweg zu Leo, „wenn man etwas Gutes tut, kommt manchmal etwas Gutes zurück.“']}],
 words:[['gestrickt','aus Wolle mit Nadeln gemacht'],['vermissen','merken, dass etwas fehlt, und traurig sein'],['ungeduldig','man will nicht mehr warten'],['das Andenken','etwas, das an einen Menschen oder ein Erlebnis erinnert'],['die Masche','eine kleine Schlinge beim Stricken']],
 qs:[{t:'mc',q:'Wo lag der Handschuh?',a:'Vor dem Brunnen im Schnee',w:['Beim Bäcker','Im Bus']},
  {t:'mc',q:'Was war auf dem Handschuh?',a:'Ein kleines weisses Herz',w:['Ein Stern','Ein Name']},
  {t:'rf',q:'Leo wollte den Handschuh zuerst behalten.',a:true},
  {t:'rf',q:'Der Bäcker hatte den Handschuh verloren.',a:false},
  {t:'order',items:['Nils fand den Handschuh.','Die Brüder fragten den Bäcker.','Nils band den Handschuh an den Brunnen.','Frau Keller klingelte an der Tür.']},
  {t:'word',q:'Was bedeutet „Ihre Augen glänzten“?',a:'Sie war gerührt und sehr froh',w:['Sie war müde','Ihre Brille war schmutzig']},
  {t:'why',q:'Warum war der Handschuh für Frau Keller so wichtig?',a:'Ihr Mann hatte ihn für sie gestrickt',w:['Er war sehr teuer','Sie hatte ihn eben im Laden gekauft']},
  {t:'gap',q:'„Gefunden! Wir wohnen im gelben Haus Nummer ___.“',a:['4','vier']},
  {t:'write',q:'Was hättest du mit dem Handschuh gemacht? Warum? Schreibe einen Satz.',m:'Ich hätte den Handschuh zurückgegeben, weil jemand ihn bestimmt vermisst.'}]},

{id:'robo',title:'Robo in der Klasse',theme:'Freundschaft',teaser:'Ein Roboter weiss alle Antworten – aber er hat keinen einzigen Freund.',
 parts:[
  {img:()=>PIC(D.wall('#eef0e6')+D.board('347 · 28 = 9716')+D.kid(40,172,{s:1.25,shirt:'#c0533a',hair:'#6b3a1e',long:true,glasses:true})+D.robot(140,166,1.1)+D.kid(220,170,{shirt:'#f2b632',hair:'#222',s:.9,long:true})+D.kid(270,170,{shirt:'#3aa36b',s:.9,up:true})),
   p:['Am Montag stand in der Klasse 2b ein neuer Schüler vor der Tafel. Er war aus Metall, hatte blinkende Augen und eine Antenne auf dem Kopf. „Das ist Robo“, sagte Frau Huber, die Lehrerin. „Er besucht uns eine Woche lang und möchte lernen, wie Kinder in der Schule leben.“ Die Kinder staunten.','Robo setzte sich neben Samira. Im Mathe-Unterricht wusste er alles. „Wie viel ist 347 mal 28?“, fragte Tim zum Spass. „9716“, piepste Robo sofort. Die Kinder klatschten. Auch die Hauptstädte aller Länder kannte er, und er buchstabierte jedes schwierige Wort ohne Fehler.']},
  {img:()=>PIC(D.sky('day')+D.ground('#d9c7a6',140)+D.tree(290,140)+D.robot(70,166,1)+D.kid(180,166,{shirt:'#f2b632',hair:'#222',long:true,up:true,up2:true})+D.kid(235,160,{shirt:'#3aa36b',up2:true})+D.kid(150,170,{shirt:'#e5483d',s:.9,up:true})),
   p:['In der Pause stand Robo allein auf dem Pausenplatz. Die Kinder spielten Fangen und lachten. Robo verstand nicht, warum. „Ihr rennt im Kreis und kommt nirgends an“, sagte er. „Das ist nicht logisch.“','Die Kinder schauten sich an und zuckten mit den Schultern. Niemand wollte mit einem Schüler spielen, der immer alles besser wusste.']},
  {img:()=>PIC(D.sky('day')+D.ground('#d9c7a6',140)+D.tree(40,140,1,'#e0a03a')+D.leaves()+D.bench(160,162)+D.robot(140,160,.95,'#9aa5b4')+D.kid(182,160,{shirt:'#f2b632',hair:'#222',long:true})),
   p:['Am Mittwoch sah Samira, dass Robos Augen nicht mehr blinkten. Sie setzte sich zu ihm. „Bist du traurig?“, fragte sie. „Ich weiss nicht, was traurig ist“, sagte Robo. „Aber ich weiss alle Antworten und habe trotzdem keinen Freund. Das kann ich nicht ausrechnen.“','Samira überlegte. „Freunde rechnet man nicht aus“, sagte sie. „Man muss zusammen etwas erleben. Komm, ich zeige dir, wie man Fangen spielt. Es geht nicht ums Ankommen. Es geht ums Lachen.“']},
  {img:()=>PIC(D.sky('day')+D.ground('#d9c7a6',140)+D.tree(290,140,1,'#e0a03a')+D.leaves()+D.robot(150,172,1,'#47d1ff',-65)+D.kid(90,168,{shirt:'#f2b632',hair:'#222',long:true,up:true,up2:true})+D.kid(220,168,{shirt:'#3aa36b',up:true,up2:true})+D.kid(255,170,{shirt:'#e5483d',s:.9,up2:true})+'<text x="150" y="70" text-anchor="middle" font-family="Comic Sans MS, sans-serif" font-size="15" fill="#3b4f8a">Ha-ha-piep-ha!</text>'),
   p:['Samira erklärte die Regeln. Robo rannte los, stolperte über seine eigenen Füsse und fiel ins Laub. Die Kinder hielten den Atem an. Dann machte Robo ein Geräusch, das niemand kannte: „Ha-ha-piep-ha!“ Er lachte! Alle Kinder lachten mit.','Von da an spielte Robo in jeder Pause mit. Er half den anderen bei schwierigen Rechnungen, und sie zeigten ihm Witze, Spiele und Lieder. Am Freitag musste Robo zurück in die Fabrik. Zum Abschied sagte er: „Ich habe hier die wichtigste Sache gelernt, die nicht in meinem Computer war: Freundschaft.“']}],
 words:[['die Antenne','ein Stab, mit dem man Signale empfängt'],['logisch','vernünftig, man kann es gut erklären'],['mit den Schultern zucken','zeigen, dass man etwas nicht weiss'],['den Atem anhalten','vor Spannung kurz nicht atmen'],['der Abschied','wenn man sich auf Wiedersehen sagt']],
 qs:[{t:'mc',q:'Wie lange besuchte Robo die Klasse?',a:'Eine Woche',w:['Einen Tag','Ein ganzes Jahr']},
  {t:'mc',q:'Neben wem sass Robo?',a:'Neben Samira',w:['Neben Tim','Neben Frau Huber']},
  {t:'rf',q:'Robo wusste in Mathe alle Antworten.',a:true},
  {t:'rf',q:'In der ersten Pause spielte Robo gleich mit allen.',a:false},
  {t:'order',items:['Robo kam in die Klasse.','Robo stand in der Pause allein.','Samira sprach mit Robo.','Robo lachte zum ersten Mal.']},
  {t:'word',q:'Was bedeutet „Die Kinder hielten den Atem an“?',a:'Sie waren gespannt, was passiert',w:['Sie waren unter Wasser','Sie hatten Schnupfen']},
  {t:'why',q:'Warum wollte am Anfang niemand mit Robo spielen?',a:'Weil er immer alles besser wusste',w:['Weil er zu langsam war','Weil er nicht sprechen konnte']},
  {t:'gap',q:'„Freunde rechnet man nicht ___.“',a:['aus']},
  {t:'write',q:'Was ist wichtiger: alles wissen oder Freunde haben? Schreibe deine Meinung in einem Satz.',m:'Freunde haben ist wichtiger, weil man zusammen lachen und sich helfen kann.'}]},

{id:'selma',title:'Selma sieht genau hin',theme:'Genau hinschauen',teaser:'Ein Wettbewerb im Garten: Wer entdeckt am meisten? Der schnelle Hase – oder die Schnecke?',
 parts:[
  {img:()=>PIC(D.sky('day')+D.sun(40,32)+D.ground('#8cc66a',130)+D.shed(270,130)+D.bed(20,150,80)+D.flowers([[30,150,'#f06292'],[50,150,'#ffd23f'],[70,150,'#8a5cc4'],[90,150,'#f06292']])+D.hare(150,160,1.1)+D.snail(215,166,1.1)+D.bird(110,118)+'<rect x="232" y="96" width="6" height="40" fill="#a4733f"/>'+D.owl(235,96,.9)),
   p:['Im Garten von Familie Brunner fand jedes Jahr ein grosser Wettbewerb statt. Die Tiere wollten wissen: Wer ist der beste Entdecker im Garten? Der Hase Hopp war sicher, dass er gewinnt. „Ich bin der Schnellste!“, prahlte er. „Ich renne in einer Minute durch den ganzen Garten.“ Auch die Amsel und das Eichhörnchen wollten mitmachen.','Ganz hinten meldete sich eine kleine Schnecke. „Ich möchte auch mitmachen“, sagte sie. „Ich heisse Selma.“ Die anderen lachten. „Du? Bis du am Gartentor bist, ist der Sommer vorbei!“']},
  {img:()=>PIC(D.sky('day')+D.ground('#8cc66a',130)+D.tree(60,132,1,'#4f9e45')+'<circle cx="52" cy="92" r="3" fill="#d93a32"/><circle cx="70" cy="98" r="3" fill="#d93a32"/>'+D.hare(220,160,1.2,1,true)+D.snail(70,168,.8)+D.bird(150,60)+'<rect x="292" y="100" width="6" height="40" fill="#a4733f"/>'+D.owl(295,100,.85)),
   p:['Die Eule erklärte die Regeln: „Jeder geht bis zum Abend durch den Garten. Dann erzählt ihr, was ihr entdeckt habt. Wer die meisten Dinge sieht, gewinnt.“','Hopp sauste los. Er rannte um die Beete, über den Rasen und um das Gartenhaus. Nach wenigen Minuten war er schon wieder zurück und legte sich in die Sonne. Die Amsel flog von Baum zu Baum, und das Eichhörnchen kletterte auf den Kirschbaum. Selma kroch langsam los.']},
  {img:()=>PIC(D.sky('spring')+D.ground('#8cc66a',128)+D.fence(92)+D.web(230,70)+D.beetle(80,160)+D.flowers([[40,170,'#8a5cc4'],[52,172,'#8a5cc4']])+D.snail(160,164,1.6)+'<g fill="#3a2a1a">'+[200,208,216,224,232,240].map(x=>`<circle cx="${x}" cy="172" r="1.6"/>`).join('')+'</g><rect x="246" y="167" width="9" height="7" rx="2" fill="#e9c27a"/>'+D.hedgehog(286,156,.9)),
   p:['Selma schaute genau hin. Unter einem Blatt fand sie einen glänzenden blauen Käfer. Zwischen den Steinen wuchs ein winziges Pflänzchen mit violetten Blüten. Am Zaun hing ein Spinnennetz voller Wassertropfen, die wie Perlen glitzerten.','Eine Ameisenstrasse führte zu einem Krümel Kuchen. Und unter dem Gartenhaus entdeckte sie sogar ein Igelnest mit drei schlafenden Igelkindern. Selma zählte alles und merkte es sich gut.']},
  {img:()=>PIC(D.sky('evening')+D.ground('#7fb85a',130)+D.owl(220,150,1.6)+D.snail(130,166,1.5,true)+D.hare(60,160,1,1)+D.hedgehog(270,170,.7)+D.hedgehog(295,172,.6)),
   p:['Am Abend versammelten sich alle bei der Eule. Hopp sagte: „Ich habe das Haus, den Rasen und die Beete gesehen.“ Die Amsel hatte fünf Bäume gesehen, das Eichhörnchen drei Kirschen. Dann erzählte Selma. Sie erzählte vom blauen Käfer, vom glitzernden Spinnennetz, von der Ameisenstrasse und den Igelkindern. Die anderen Tiere hörten mit offenem Mund zu.','Hopp wurde rot unter seinem Fell. „Das habe ich alles nicht gesehen“, sagte er. „Ich war viel zu schnell.“ Die Eule lächelte und gab Selma eine Krone aus Gänseblümchen. „Wer langsam und genau hinschaut, sieht die schönsten Dinge.“']}],

{id:'kletter',title:'Der zweite Versuch',theme:'Nicht aufgeben',teaser:'Bens erster Kletterwettkampf – und eine schwarze Route mit einem Überhang.',
 parts:[
  {img:()=>PIC(D.climbWall()+D.kid(130,172,{shirt:'#3b82c4'})+D.kid(172,172,{shirt:'#e5483d',hair:'#2b1a10',braid:true})),
   p:['Ben ging seit einem Jahr ins Klettertraining. Am Samstag war sein erster Kletterwettkampf. In der grossen Halle hingen bunte Griffe an den Wänden: gelbe, rote, blaue. Jede Farbe war eine andere Route. Die schwierigste Route war die schwarze. Sie führte ganz oben über einen Überhang. Ben schaute hinauf und schluckte.','Neben ihm wartete ein Mädchen mit einem langen Zopf. „Ich bin Aylin“, sagte sie. „Ich bin auch zum ersten Mal hier.“ Ben war froh, dass er nicht der Einzige war, der nervös war.']},
  {img:()=>PIC(D.climbWall()+'<line x1="180" y1="26" x2="180" y2="86" stroke="#f2b632" stroke-width="2"/><line x1="180" y1="26" x2="210" y2="140" stroke="#f2b632" stroke-width="2"/>'+D.kid(180,122,{shirt:'#3b82c4',up:true,up2:true,sad:true})+D.kid(210,172,{s:1.25,shirt:'#3aa36b',hair:'#555'})+D.kid(60,172,{shirt:'#e5483d',hair:'#2b1a10',braid:true,s:.95})),
   p:['Zuerst kam die gelbe Route. Ben kletterte ruhig und sicher bis ganz nach oben. Die Leute klatschten. Auch die rote Route schaffte er. Dann kam die schwarze Route. Ben kletterte schnell los, viel zu schnell. Unter dem Überhang wurden seine Arme müde.','Er griff nach einem kleinen schwarzen Griff, aber seine Finger rutschten ab. Er fiel ins Seil. Der Trainer liess ihn langsam herunter. Ben ärgerte sich. Er setzte sich auf die Bank und wollte nach Hause.']},
  {img:()=>PIC(D.climbWall()+'<path d="M160 130 L150 100 L162 60 L180 30" stroke="#3b82c4" stroke-width="2" stroke-dasharray="5 4" fill="none"/>'+D.kid(130,174,{shirt:'#3b82c4',up2:true})+D.kid(185,174,{shirt:'#e5483d',hair:'#2b1a10',braid:true,up:true})),
   p:['Da kam Aylin zu ihm. Sie hatte die schwarze Route auch nicht ganz geschafft. „Wir haben noch einen Versuch“, sagte sie. „Lass uns die Route zuerst genau anschauen.“ Zusammen standen sie unten und zeigten mit dem Finger, wo welcher Griff war.','„Hier kannst du dich kurz ausruhen“, sagte Ben und zeigte auf einen grossen Griff. „Und hier musst du den linken Fuss hoch nehmen“, sagte Aylin. Sie machten einen Plan.']},
  {img:()=>PIC('<rect width="320" height="180" fill="#e7ebf1"/>'+D.confetti()+D.podium()+D.kid(160,120,{shirt:'#8a5cc4',hair:'#c98b4e',up:true,up2:true})+D.kid(75,135,{shirt:'#e5483d',hair:'#2b1a10',braid:true,up2:true})+D.kid(245,145,{shirt:'#3b82c4',up:true})+D.medal(160,96,'#d9a514')+D.medal(75,111,'#b8c3d1')+D.medal(245,121,'#c27a3a')),
   p:['Beim zweiten Versuch kletterte Ben langsam. Am grossen Griff schüttelte er die Arme aus. Dann nahm er den linken Fuss hoch, so wie Aylin gesagt hatte, und erreichte den kleinen schwarzen Griff. Er zog sich über den Überhang und schlug auf den letzten Griff. Geschafft! Auch Aylin kam nach ihm bis ganz oben.','Am Ende war Ben Dritter und Aylin Zweite. Bei der Siegerehrung standen sie nebeneinander und grinsten. „Danke für den Plan“, sagte Ben. „Danke für deine Hilfe“, sagte Aylin. Beide wussten: Zusammen und mit einem zweiten Versuch klappt es oft besser.']}],
 words:[['der Griff','ein Stein an der Kletterwand zum Festhalten'],['die Route','der Weg an der Wand'],['der Überhang','eine Stelle, wo die Wand nach vorne kippt'],['schlucken','hier: kurz Angst bekommen'],['die Siegerehrung','die Gewinner bekommen ihre Preise']],
 qs:[{t:'mc',q:'Welche Route war die schwierigste?',a:'Die schwarze',w:['Die gelbe','Die rote']},
  {t:'mc',q:'Wer war Aylin?',a:'Ein Mädchen, das auch zum ersten Mal da war',w:['Bens Schwester','Die Trainerin']},
  {t:'rf',q:'Ben schaffte die schwarze Route beim ersten Versuch.',a:false},

  {t:'order',items:['Ben kletterte die gelbe Route.','Ben fiel ins Seil.','Ben und Aylin schauten die Route genau an.','Ben schlug auf den letzten Griff.']},
  {t:'word',q:'Was bedeutet „Ben ärgerte sich“?',a:'Er war wütend und enttäuscht',w:['Er war glücklich','Er war hungrig']},
  {t:'why',q:'Warum fiel Ben beim ersten Versuch?',a:'Er kletterte zu schnell und seine Arme wurden müde',w:['Ein Griff fiel ab','Aylin schubste ihn']},

{id:'garten',title:'Das Geheimnis im Garten',theme:'Geduld',teaser:'Oma schenkt Mila eine Tüte Samen. Was daraus wächst, ist ein Geheimnis.',
 parts:[
  {img:()=>PIC(D.sky('spring')+D.sun(282,30)+D.ground('#8cc66a',128)+D.fence(96)+'<ellipse cx="170" cy="160" rx="34" ry="7" fill="#7a4e2a"/>'+D.kid(60,170,{s:1.25,shirt:'#7a5a8a',hair:'#d8d8d8',glasses:true})+D.kid(140,170,{shirt:'#e5483d',long:true,hair:'#6b3a1e'})+D.kid(205,172,{shirt:'#3b82c4',s:.78})+D.can(232,168)+'<rect x="100" y="146" width="12" height="16" rx="2" fill="#f2b632"/>'),
   p:['Im Frühling schenkte Oma Mila eine kleine Tüte mit Samen. „Das ist ein Geheimnis“, sagte Oma. „Was daraus wächst, verrate ich nicht. Aber du musst gut für die Samen sorgen.“','Mila und ihr kleiner Bruder Tim gruben zusammen ein Loch am Gartenzaun. Mila legte die Samen hinein, Tim schüttete Erde darüber und goss sie mit seiner kleinen grünen Giesskanne.']},
  {img:()=>PIC(D.sky('spring')+D.ground('#8cc66a',128)+D.fence(96)+'<ellipse cx="160" cy="160" rx="40" ry="8" fill="#7a4e2a"/>'+D.kid(115,172,{shirt:'#9ec5ef',s:.8,sad:true,pants:'#9ec5ef'})+D.kid(215,170,{shirt:'#e5483d',long:true,hair:'#6b3a1e'})+'<rect x="232" y="128" width="20" height="26" rx="2" fill="#fff" stroke="#c7cdd6"/><g stroke="#8a5a33"><line x1="236" y1="136" x2="248" y2="136"/><line x1="236" y1="142" x2="248" y2="142"/><line x1="236" y1="148" x2="248" y2="148"/></g>'),
   p:['Am nächsten Morgen rannte Tim im Pyjama hinaus. „Es ist nichts gewachsen!“, rief er enttäuscht. Mila lachte. „So schnell geht das nicht.“ Doch auch nach drei Tagen war nichts zu sehen. Tim wollte die Erde aufgraben und nachschauen. „Nein!“, sagte Mila. „Dann stören wir die Samen.“','Sie gossen jeden Abend, wenn es nicht regnete. Mila malte jeden Tag ein Bild in ein kleines Heft: Erde, Erde, Erde.']},
  {img:()=>PIC(D.sky('day')+D.ground('#8cc66a',150)+D.bigPlant(120,30)+D.bigPlant(165,20)+D.bigPlant(210,38)+D.kid(70,172,{shirt:'#e5483d',long:true,hair:'#6b3a1e',up:true})+D.kid(265,172,{shirt:'#3b82c4',s:.8,up2:true})),
   p:['Am zehnten Tag schaute ein winziger grüner Spitz aus der Erde. Dann zwei, dann fünf. Die Pflänzchen wuchsen jeden Tag. Bald waren sie so gross wie Tim, dann so gross wie Mila, dann noch grösser als Papa! Die Stängel waren dick, und die Blätter so gross wie Teller.','„Was ist das bloss?“, fragte Tim jeden Tag. Doch es kam keine Blüte. Mila wurde ungeduldig. Aber sie dachte an Oma und goss weiter.']},
  {img:()=>PIC(D.sky('day')+D.sun(40,30)+D.ground('#8cc66a',150)+D.bigPlant(100,48,true)+D.bigPlant(160,30,true)+D.bigPlant(220,52,true)+D.bigPlant(275,40,true)+D.bee(130,40)+D.bee(250,70)+D.kid(55,174,{shirt:'#e5483d',long:true,hair:'#6b3a1e',up:true,up2:true})+D.kid(300,176,{shirt:'#3b82c4',s:.75,up:true})),
   p:['Im August öffneten sich endlich die Knospen. Riesige gelbe Blüten leuchteten über dem Zaun, und alle drehten ihre Köpfe zur Sonne. „Sonnenblumen!“, rief Mila. Die Nachbarn blieben stehen und staunten. Bienen summten um die Blüten.','Im Herbst waren die Blumen voller Kerne. Mila und Tim sammelten sie und füllten neue Tüten. Eine schenkten sie Oma, die anderen den Kindern aus der Strasse. „Und jetzt“, sagte Mila, „verraten wir das Geheimnis nicht. Die anderen sollen auch lernen zu warten.“']}],
 words:[['der Samen','daraus wächst eine Pflanze'],['sorgen für','sich um etwas kümmern'],['enttäuscht','traurig, weil es anders ist als gehofft'],['der Stängel','der lange Teil der Pflanze, der die Blüte trägt'],['verraten','ein Geheimnis weitersagen']],
 qs:[{t:'mc',q:'Was schenkte Oma Mila?',a:'Eine Tüte mit Samen',w:['Eine Giesskanne','Eine Sonnenblume']},
  {t:'mc',q:'Was wollte Tim nach drei Tagen tun?',a:'Die Erde aufgraben und nachschauen',w:['Die Samen essen','Oma anrufen']},
  {t:'rf',q:'Schon am nächsten Morgen wuchs eine Pflanze.',a:false},
  {t:'rf',q:'Die Pflanzen wurden grösser als Papa.',a:true},
  {t:'order',items:['Mila und Tim pflanzten die Samen.','Tim rannte im Pyjama hinaus.','Ein grüner Spitz kam aus der Erde.','Die gelben Blüten öffneten sich.']},
  {t:'word',q:'Was bedeutet „ungeduldig“?',a:'Man will nicht mehr länger warten',w:['Man ist ganz ruhig','Man ist krank']},
  {t:'why',q:'Warum durfte Tim die Erde nicht aufgraben?',a:'Weil sie sonst die Samen stören',w:['Weil Oma es verboten hatte','Weil es regnete']},
  {t:'gap',q:'„Im August öffneten sich endlich die ___.“',a:['Knospen']},
  {t:'write',q:'Was lernen Mila und Tim in dieser Geschichte? Schreibe einen Satz.',m:'Sie lernen, dass man für schöne Dinge Geduld braucht.'}]},

{id:'zug',title:'Der Zug kommt später',theme:'Das Beste daraus machen',teaser:'Eine halbe Stunde warten im Hauptbahnhof – wie langweilig! Oder doch nicht?',
 parts:[
  {img:()=>PIC(D.station('Luzern   9:04','+30\'')+D.kid(120,174,{s:1.3,shirt:'#3aa36b',hair:'#222'})+D.kid(160,174,{shirt:'#e5483d',long:true,hair:'#222',sad:true})+D.suitcase(220,174,'#3b82c4')+D.kid(260,174,{s:1.25,shirt:'#8a5cc4',hair:'#c98b4e'})+D.suitcase(280,174,'#f2b632')),
   p:['Mia wollte mit Papa zu ihrer Tante nach Luzern fahren. Am Zürcher Hauptbahnhof war es laut und voll. Menschen mit Koffern eilten in alle Richtungen. Mia schaute auf die grosse Anzeigetafel. Neben ihrem Zug stand plötzlich eine gelbe Zahl: „+30“.','„Oh nein“, stöhnte Mia. „Eine halbe Stunde warten! Das ist so langweilig.“']},
  {img:()=>PIC(D.station('Luzern   9:04','+30\'')+D.bench(90,178)+D.kid(75,166,{s:1.2,shirt:'#3aa36b',hair:'#222'})+D.kid(106,168,{shirt:'#e5483d',long:true,hair:'#222',s:.9})+D.kid(235,174,{s:1.25,shirt:'#c0533a',hair:'#111'})+D.kid(272,174,{s:1.2,shirt:'#f2b632',hair:'#111',long:true})+D.map(236,118)+D.kid(205,176,{shirt:'#3b82c4',hair:'#111',s:.8,sad:true})+D.elephant(214,158,.8)),
   p:['Papa kaufte zwei Brezeln, und sie setzten sich auf eine Bank. Mia baumelte mit den Beinen und schaute auf die Uhr. Die Minuten krochen.','Da bemerkte sie eine Familie mit einem grossen Stadtplan. Die Eltern drehten den Plan hin und her und sprachen eine Sprache, die Mia nicht verstand. Ihr Sohn war etwa so alt wie Mia und sah müde aus. Er hielt einen Stoff-Elefanten fest im Arm.']},
  {img:()=>PIC('<rect width="320" height="180" fill="#e7ebf1"/><rect y="150" width="320" height="30" fill="#9aa5b4"/>'+D.kid(130,176,{shirt:'#e5483d',long:true,hair:'#222',rot:18})+D.kid(190,176,{shirt:'#3b82c4',hair:'#111',rot:-18})+D.elephant(214,176,1)+D.pretzel(110,130)+'<text x="160" y="40" text-anchor="middle" font-family="Comic Sans MS, sans-serif" font-size="16" fill="#3b4f8a">Grüezi!</text>'),
   p:['Papa ging zu ihnen und fragte auf Englisch, ob er helfen könne. Die Familie kam aus Japan und wollte zum Zürichsee. Papa zeigte ihnen auf dem Plan den Weg zum Tram. Mia zeigte dem Jungen ihre Brezel und brach ein Stück ab. Der Junge lachte und zeigte ihr seinen Elefanten. Er hiess Haruto.','Mia brachte ihm bei, wie man auf Schweizerdeutsch „Grüezi“ sagt. Haruto zeigte ihr, wie man sich auf Japanisch verbeugt. Sie lachten beide, weil sie sich gleichzeitig verbeugten und fast mit den Köpfen zusammenstiessen.']},
  {img:()=>PIC(D.sky('day')+D.mountains('#93a3bb',true)+D.hills('#a4d67f','#86c35f')+D.lake(150)+D.rail(150)+D.train(70,150)+'<circle cx="104" cy="122" r="4.5" fill="#f1c7a1"/><path d="M99 121 Q104 114 109 121Z" fill="#222"/><line x1="108" y1="122" x2="114" y2="114" stroke="#f1c7a1" stroke-width="2" stroke-linecap="round"/>'),
   p:['Plötzlich hörte Mia die Durchsage: „Der Zug nach Luzern fährt auf Gleis 8 ein.“ Die halbe Stunde war wie im Flug vergangen! Haruto und Mia winkten sich lange zu.','Im Zug sagte Papa: „Erinnerst du dich? Vor dreissig Minuten hast du gesagt, Warten sei langweilig.“ Mia grinste. „Warten ist nur langweilig, wenn man nichts daraus macht.“ Sie schaute aus dem Fenster auf die Berge und dachte: Vielleicht treffe ich Haruto eines Tages in Japan wieder.']}],

const SAY={on:'speechSynthesis' in window,v:null};
function pickVoice(){if(!SAY.on)return;const vs=speechSynthesis.getVoices();SAY.v=vs.find(v=>/de[-_]CH/i.test(v.lang))||vs.find(v=>/^de/i.test(v.lang))||null}
if(SAY.on){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(t,el){if(!SAY.on)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[„“]/g,''));u.lang=SAY.v?SAY.v.lang:'de-DE';if(SAY.v)u.voice=SAY.v;u.rate=.8;
  if(el){document.querySelectorAll('.sent.speaking').forEach(x=>x.classList.remove('speaking'));el.classList.add('speaking');u.onend=()=>el.classList.remove('speaking')}
  speechSynthesis.speak(u)}catch(e){}}

const QLABEL={mc:'Frage',rf:'Richtig oder falsch?',order:'Reihenfolge',word:'Wortbedeutung',why:'Warum?',gap:'Lückensatz',write:'Schreib selbst'};

/* ---------- app ---------- */
const app=document.getElementById('app');
let view={screen:'list',cid:null,q:null,tries:0,done:false};
const list=()=>store.tab==='deutsch'?DEUTSCH:MATHE;
const total=()=>Object.values(store.stars).reduce((s,n)=>s+n,0);

function setTab(t){store.tab=t;save();view={screen:'list'};render();window.scrollTo(0,0)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.t)));

function render(){
  document.body.dataset.subject=store.tab;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===store.tab));
  document.getElementById('total').textContent=total();
  app.onclick=null;app.onkeydown=null;
  if(store.tab==='lesen')return view.screen==='story'?renderStory():renderLesen();
  if(store.tab==='fort')return renderProgress();
  if(view.screen==='list')return renderList();
  renderConcept();
}

function renderList(){
  const L=list();
  app.innerHTML=`<p class="intro">${store.tab==='mathe'
    ?'Tippe auf ein Thema. Zuerst kommt die Erklärung, dann kannst du so viele Aufgaben lösen, wie du willst. Jede richtige Antwort gibt einen Stern.'
    :'Tippe auf ein Thema. Zuerst kommt die Erklärung, dann kannst du so viele Übungen machen, wie du willst. Jede richtige Antwort gibt einen Stern.'}</p>
  <div class="list">${L.map(c=>`<button class="card" data-id="${c.id}">
    <span class="glyph" aria-hidden="true">${c.glyph}</span>
    <span class="card-t"><strong>${c.title}</strong><small>${c.sub}</small>
    <span class="meta"><span class="pill">${c.week}</span><span><span class="star">★</span> ${store.stars[c.id]||0}</span></span></span></button>`).join('')}</div>
  <p class="foot">Passt zum Wochenplan im Gymi-Leitfaden. Die Sterne werden nur auf diesem Gerät gespeichert.</p>`;
  app.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>{view={screen:'concept',cid:b.dataset.id,q:null};newQ();render();window.scrollTo(0,0)}));
}

function concept(){return list().find(c=>c.id===view.cid)}
function newQ(){view.q=concept().gen();view.tries=0;view.done=false;view.fb='';view.picked=null;view.wrongs=[]}

function answerArea(q){
  if(q.type==='choice')return `<div class="choices"${q.stack?' style="grid-template-columns:1fr"':''}>${q.choices.map((c,i)=>{
    let cls='';if(view.done||view.picked!=null){if(c===q.a&&view.done)cls='right';else if(view.wrongs&&view.wrongs.includes(c))cls='wrong'}
    return `<button class="choice ${cls}" data-c="${i}" ${view.done||(view.wrongs&&view.wrongs.includes(c))?'disabled':''}>${esc(c)}</button>`}).join('')}</div>`;
  if(q.type==='pair')return `<div class="pair">${q.labels.map((l,i)=>`<label for="ans${i}">${l}<input class="ans" id="ans${i}" inputmode="numeric" autocomplete="off" ${view.done?'disabled':''}></label>`).join('')}</div>`;
  if(q.type==='free')return '';
  const im=q.type==='text'?'text':q.type==='time'?'text':'decimal';
  const ph=q.type==='time'?'z.B. 19:05':'';
  return `<div class="row"><input class="ans" id="ans0" inputmode="${im}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ph}" ${view.done?'disabled':''}>${q.unit?`<span class="unit">${q.unit}</span>`:''}</div>`;
}

function renderConcept(){
  const c=concept(),q=view.q;
  app.innerHTML=`<button class="back" id="back">← Alle Themen</button>
  <div class="ctitle"><span class="glyph" aria-hidden="true">${c.glyph}</span><div><h2>${c.title}</h2><span class="pill">${c.week}</span></div></div>
  <div class="cols">
    <section class="panel"><h3>So geht's</h3>${c.kid.map(p=>`<p>${p}</p>`).join('')}<div class="ex">${c.example}</div>
      <details><summary>Für Eltern</summary><p>${c.parent}</p></details></section>
    <section class="panel" aria-live="polite"><div class="prac-head"><h3>${q.type==='free'?'Schreibaufgabe':'Üben'}</h3><span class="score"><span class="star">★</span> ${store.stars[c.id]||0}</span></div>
      <div class="q">${q.q}</div>
      ${answerArea(q)}
      <div class="btns">
        ${q.type==='free'
          ?`<button class="btn" id="done" ${view.done?'disabled':''}>Geschichte geschrieben ✓</button><button class="btn ghost" id="next">Neue Idee</button>`
          :view.done?`<button class="btn" id="next">Nächste Aufgabe →</button>`
          :`${q.type!=='choice'?'<button class="btn" id="check">Prüfen</button>':''}<button class="btn ghost" id="hint">Tipp</button>`}
      </div>
      ${view.fb||''}
    </section>
  </div>`;
  document.getElementById('back').onclick=()=>{view={screen:'list'};render();window.scrollTo(0,0)};
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{newQ();render();const a=document.getElementById('ans0');if(a)a.focus()};
  const h=document.getElementById('hint');if(h)h.onclick=()=>{view.fb=`<div class="fb tip"><b>Tipp</b>${q.hint}</div>`;render()};
  const ck=document.getElementById('check');if(ck)ck.onclick=check;
  const dn=document.getElementById('done');if(dn)dn.onclick=()=>{addStar();record(true);view.done=true;view.fb='<div class="fb ok"><b>Super gemacht!</b><span class="why">Lies deine Geschichte jemandem vor.</span></div>';render()};
  app.querySelectorAll('.ans').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}}));
  app.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>check(q.choices[+b.dataset.c])));
}

const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const emptyDay=()=>({m:{ok:0,all:0},d:{ok:0,all:0},t:{}});
function record(ok){const k=dkey(),D=store.days[k]=store.days[k]||emptyDay(),sb=store.tab==='mathe'?'m':'d';D[sb].all++;if(ok)D[sb].ok++;const T=D.t[view.cid]=D.t[view.cid]||{ok:0,all:0};T.all++;if(ok)T.ok++;save()}
function addStar(){store.stars[view.cid]=(store.stars[view.cid]||0)+1;save()}

function isRight(q,val){
  if(q.type==='choice')return val===q.a;
  if(q.type==='pair')return q.a.every((x,i)=>numOf(val[i])===x);
  if(q.type==='time'){const m=minOf(val);return !isNaN(m)&&(m%1440)===(q.a%1440)}
  if(q.type==='text')return q.a.some(x=>norm(x)===norm(val));
  const n=numOf(val);return !isNaN(n)&&Math.abs(n-q.a)<0.001;
}
function shown(q){if(q.type==='pair')return `${q.a[0]} Rest ${q.a[1]}`;if(q.type==='time')return hm(q.a)+' Uhr';if(q.type==='text')return q.a[0];if(q.type==='choice')return q.a;
  return (q.unit==='Fr.'&&!Number.isInteger(q.a)?fr(q.a):String(q.a))+(q.unit?' '+q.unit:'')}

function check(choiceVal){
  const q=view.q;if(view.done)return;
  let val;
  if(q.type==='choice')val=choiceVal;
  else if(q.type==='pair')val=[0,1].map(i=>document.getElementById('ans'+i).value);
  else val=document.getElementById('ans0').value;
  const empty=q.type==='pair'?val.some(v=>String(v).trim()===''):q.type!=='choice'&&String(val).trim()==='';
  if(empty){view.fb='<div class="fb tip"><b>Fast!</b>Schreib zuerst eine Antwort ins Feld.</div>';render();return}
  if(isRight(q,val)){
    if(view.tries<2)addStar();record(true);view.done=true;
    view.fb=`<div class="fb ok"><b>${pick(['Richtig!','Super!','Genau!','Stark gedacht!','Bravo!'])}</b><span class="why">${q.explain}</span></div>`;
  }else{
    view.tries++;if(q.type==='choice'){view.wrongs=(view.wrongs||[]).concat([val]);view.picked=val}
    if(view.tries>=2){view.done=true;record(false);view.fb=`<div class="fb no"><b>Die Lösung ist ${esc(shown(q))}</b><span class="why">${q.explain}</span></div>`}
    else view.fb=`<div class="fb no"><b>Noch nicht ganz.</b><span class="why">Versuch es nochmal. ${q.hint}</span></div>`;
  }
  const keep=q.type==='pair'?val:q.type!=='choice'?[val]:null;
  render();
  if(keep)keep.forEach((v,i)=>{const el=document.getElementById('ans'+i);if(el){el.value=v;if(!view.done){el.select();el.focus()}}});
}

const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const fmtD=k=>{const [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d);return `${WD[dt.getDay()]} ${d}.${m}.`};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const TOPIC={};MATHE.forEach(c=>TOPIC[c.id]={c,s:'m'});DEUTSCH.forEach(c=>TOPIC[c.id]={c,s:'d'});
let wipeAsk=false,importMsg='';

function lastDays(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push(dkey(d))}return out}
function streak(){let n=0;const d=new Date();const has=k=>{const D=store.days[k];return D&&((D.m.all+D.d.all)>0||!!D.g)};
  if(!has(dkey(d)))d.setDate(d.getDate()-1);
  while(has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}

function chartSVG(keys){
  const g=store.goal,W=340,H=170,L=26,B=26,T=10,R=6,cw=(W-L-R)/keys.length;
  const vals=keys.map(k=>{const D=store.days[k];return D?[D.m.ok,D.d.ok]:[0,0]});
  let max=Math.max(2*g,...vals.map(v=>v[0]+v[1]));max=Math.ceil(max/5)*5||10;
  const y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Richtige Antworten der letzten ${keys.length} Tage">`;
  [0,max/2,max].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${Math.round(v)}</text>`});
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(2*g)}" y2="${y(2*g)}" stroke="var(--fort)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W-R}" y="${y(2*g)-4}" text-anchor="end" style="fill:var(--fort)">Ziel ${2*g}</text>`;
  keys.forEach((k,i)=>{const [m,d]=vals[i],x=L+i*cw+cw*.18,bw=cw*.64;
    if(m)s+=`<rect x="${x}" y="${y(m)}" width="${bw}" height="${y(0)-y(m)}" rx="2" fill="var(--mathe)"><title>${fmtD(k)}: Mathe ${m}</title></rect>`;
    if(d)s+=`<rect x="${x}" y="${y(m+d)}" width="${bw}" height="${y(m)-y(m+d)}" rx="2" fill="var(--deutsch)"><title>${fmtD(k)}: Deutsch ${d}</title></rect>`;
    if(i%2===(keys.length-1)%2){const [yy,mm,dd]=k.split('-').map(Number);s+=`<text x="${x+bw/2}" y="${H-12}" text-anchor="middle">${dd}.</text><text x="${x+bw/2}" y="${H-2}" text-anchor="middle">${WD[new Date(yy,mm-1,dd).getDay()]}</text>`}
  });
  return s+'</svg>'}

function renderProgress(){

  // per-topic totals
  const agg={};Object.entries(store.days).forEach(([k,x])=>Object.entries(x.t||{}).forEach(([id,t])=>{const a=agg[id]=agg[id]||{ok:0,all:0,last:k};a.ok+=t.ok;a.all+=t.all;if(k>a.last)a.last=k}));
  const order=[...MATHE,...DEUTSCH].map(c=>c.id).filter(id=>agg[id]);
  const topics=order.map(id=>{const a=agg[id],p=pct(a.ok,a.all),T=TOPIC[id];return `<tr><td><span class="tag ${T.s}">${T.s==='m'?'Mathe':'Deutsch'}</span> ${T.c.title}</td><td class="n">${a.ok} / ${a.all}</td><td class="n">${p}%</td><td>${a.all>=5&&p<60?'<span class="tag warn">nochmals üben</span>':a.all>=5&&p>=85?'<span class="tag ok">sicher</span>':'<span class="muted">'+fmtD(a.last)+'</span>'}</td></tr>`}).join('');
  const backup=JSON.stringify({v:2,stars:store.stars,days:store.days,goal:store.goal,reads:store.reads,writes:store.writes,level:store.level});
  const wr=(store.writes||[]).slice(0,20).map(w=>{const st=STORIES.find(x=>x.id===w.id);return `<li><div class="wq">${fmtD(w.d)} · ${st?st.title:''} · ${esc(w.q)}</div><div class="wt">${esc(w.text)}</div></li>`}).join('');
  app.innerHTML=`<div class="pgrid">
   <section class="panel"><h3>Heute · ${fmtD(today)}</h3><div class="today">${bar('Mathe',D.m,'m')}${bar('Deutsch',D.d,'d')}<div class="bar-row"><span class="lbl">Lesen</span><div class="track"><div class="fill g" style="width:${D.g?100:0}%"></div></div><span class="n">${D.g?D.g.ok+' / '+D.g.all+' ✓':'0 / 1'}</span></div></div>
     <div class="goal">Tagesziel pro Fach: <button id="gminus" aria-label="Ziel verkleinern">−</button><b>${g}</b><button id="gplus" aria-label="Ziel vergrössern">+</button> richtige Antworten</div></section>
   <section class="panel"><h3>Übersicht</h3><div class="kpis">
     <div class="kpi"><b>${streak()}</b><span>Tage am Stück</span></div>
     <div class="kpi"><b>${wk.ok}</b><span>richtig in 7 Tagen</span></div>
     <div class="kpi"><b>${pct(wk.ok,wk.all)}%</b><span>Trefferquote 7 Tage</span></div></div>
     <p class="small muted" style="margin:10px 0 0">${wk.days} von 7 Tagen geübt · <span class="star">★</span> ${total()} Sterne insgesamt</p></section>
   <section class="panel wide chart"><h3>Die letzten 14 Tage</h3>${chartSVG(lastDays(14))}
     <div class="legend"><span><i style="background:var(--mathe)"></i>Mathe richtig</span><span><i style="background:var(--deutsch)"></i>Deutsch richtig</span></div></section>
   <section class="panel wide"><h3>Tagebuch</h3>${log?`<div class="tbl"><table><thead><tr><th>Tag</th><th class="n">Mathe</th><th class="n">Deutsch</th><th class="n">Lesen</th><th>Ziel</th></tr></thead><tbody>${log}</tbody></table></div><p class="small muted" style="margin:8px 0 0">richtig / gelöst · Ziel = beide Tagesziele und die Geschichte des Tages · die letzten 30 Übungstage</p>`:'<p class="muted">Noch keine Übungen. Wähle unten im Tab Mathe oder Deutsch ein Thema – jede gelöste Aufgabe erscheint hier mit Datum.</p>'}</section>
   <section class="panel wide"><h3>Geschriebene Sätze</h3>${wr?`<ul class="wlist">${wr}</ul><p class="small muted" style="margin:10px 0 0">Die letzten 20 Sätze aus dem Tab Lesen. Lest sie zusammen und lobt zuerst eine gute Idee.</p>`:'<p class="muted">Nach jeder Geschichte schreibt er einen eigenen Satz. Die Sätze erscheinen hier mit Datum.</p>'}</section>
   <section class="panel wide"><h3>Themen</h3>${topics?`<div class="tbl"><table><thead><tr><th>Thema</th><th class="n">Richtig</th><th class="n">Quote</th><th>Stand</th></tr></thead><tbody>${topics}</tbody></table></div><p class="small muted" style="margin:8px 0 0">„nochmals üben“ ab 5 Aufgaben unter 60 %, „sicher“ ab 85 %.</p>`:'<p class="muted">Hier siehst du bald, welche Themen schon sicher sitzen.</p>'}</section>
   <section class="panel wide"><h3>Sicherung</h3>
     <p class="small">Der Fortschritt wird in diesem Browser gespeichert. Kopiere ab und zu den Code unten (z.B. in Notizen), damit nichts verloren geht. Auf einem anderen Gerät fügst du ihn unten ein.</p>
     <textarea id="bk" readonly>${esc(backup)}</textarea>
     <div class="btns" style="margin-top:8px"><button class="btn ghost" id="copy">Code kopieren</button></div>
     <p class="small" style="margin-top:14px">Sicherung wiederherstellen:</p>
     <textarea id="imp" placeholder="Code hier einfügen"></textarea>
     <div class="btns" style="margin-top:8px"><button class="btn ghost" id="load">Sicherung laden</button>${wipeAsk?'<button class="btn danger" id="wipe2">Ja, alles löschen</button><button class="btn ghost" id="wipe0">Abbrechen</button>':'<button class="btn ghost" id="wipe">Alles löschen</button>'}</div>
     ${importMsg?`<div class="fb ${importMsg.startsWith('OK')?'ok':'no'}">${importMsg.replace(/^OK /,'')}</div>`:''}</section>
  </div>`;
  importMsg='';
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  on('gminus',()=>{store.goal=Math.max(1,g-1);save();render()});
  on('gplus',()=>{store.goal=Math.min(50,g+1);save();render()});
  on('copy',()=>{const t=document.getElementById('bk'),b=document.getElementById('copy');const done=()=>{b.textContent='Kopiert ✓'};
    try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();b.textContent='Markiert – jetzt kopieren'})}catch(e){t.select();b.textContent='Markiert – jetzt kopieren'}});
  on('load',()=>{try{const o=JSON.parse(document.getElementById('imp').value.trim());if(!o||typeof o.days!=='object'||typeof o.stars!=='object')throw 0;
      store.days=o.days;store.stars=o.stars;store.goal=o.goal||store.goal;store.reads=o.reads||{};store.writes=o.writes||[];save();importMsg='OK Sicherung geladen.'}catch(e){importMsg='Das ist kein gültiger Sicherungs-Code. Kopiere den ganzen Text aus dem oberen Feld.'}render()});
  on('wipe',()=>{wipeAsk=true;render()});on('wipe0',()=>{wipeAsk=false;render()});
  on('wipe2',()=>{store.days={};store.stars={};store.reads={};store.writes=[];wipeAsk=false;save();render()});
}

/* ---------- Lesen ---------- */
store.reads=store.reads||{};store.writes=store.writes||[];store.level=store.level||'leicht';
const isEasy=()=>store.level==='leicht';const minLbl=()=>isEasy()?'ca. 5 Minuten':'ca. 10 Minuten';
const curStory=()=>STORIES.find(x=>x.id===view.sid);
const fbx=(k,h)=>`<div class="fb ${k}">${h}</div>`;
function storyOfDay(){const D=store.days[dkey()];if(D&&D.g&&D.g.id){const s=STORIES.find(x=>x.id===D.g.id);if(s)return s}
  const un=STORIES.find(s=>!store.reads[s.id]);if(un)return un;
  return STORIES[Math.floor(Date.now()/864e5)%STORIES.length]}
function mixOrder(n){let a;do{a=shuffle([...Array(n).keys()])}while(a.every((k,j)=>k===j));return a}

function renderLesen(){
  const s=storyOfDay(),D=store.days[dkey()],done=D&&D.g&&D.g.id===s.id;
  app.innerHTML=`<div class="seg" role="group" aria-label="Schwierigkeit"><button class="${isEasy()?'on':''}" data-lvl="leicht">Leicht · 5 Min</button><button class="${isEasy()?'':'on'}" data-lvl="lang">Lang · 10 Min</button></div>
  <section class="panel sotd"><div class="pic">${s.parts[0].img()}</div><div class="sotd-t">
    <span class="pill">Geschichte des Tages · ${minLbl()}</span><h2>${s.title}</h2><p>${s.teaser}</p>
    <p class="small muted">Thema: ${s.theme}${done?` · heute gelesen ✓ ${D.g.ok} von ${D.g.all} richtig`:''}</p>
    <button class="btn" data-open="${s.id}">${done?'Nochmals lesen':'Jetzt lesen'}</button></div></section>
  <h3 class="sec">Alle Geschichten</h3>
  <div class="list">${STORIES.map(x=>{const r=store.reads[x.id];return `<button class="card scard" data-open="${x.id}"><span class="thumb" aria-hidden="true">${x.parts[0].img()}</span><span class="card-t"><strong>${x.title}</strong><small>Thema: ${x.theme}</small><span class="meta">${r?`<span class="pill">✓ ${fmtD(r.date)} · ${r.ok}/${r.all} richtig</span>`:'<span class="pill">neu</span>'}</span></span></button>`}).join('')}</div>
  <p class="foot">„Leicht“: kurze Sätze zum Selberlesen. „Lang“: dieselbe Geschichte mit mehr Text. Die Fragen sind gleich. Jeden Tag kommt die nächste neue Geschichte. Wenn alle gelesen sind, beginnen sie wieder von vorne – beim zweiten Lesen geht es schneller und sicherer.</p>`;
  app.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openStory(b.dataset.open)));
  app.querySelectorAll('[data-lvl]').forEach(b=>b.addEventListener('click',()=>{store.level=b.dataset.lvl;save();render()}));
}

function openStory(id){const s=STORIES.find(x=>x.id===id);
  view={screen:'story',sid:id,t0:Date.now(),saved:false,sa:s.qs.map(q=>({tries:0,done:false,ok:false,wrongs:[],pick:[],val:'',msg:'',
    ch:q.t==='rf'?['Richtig','Falsch']:q.t==='order'?mixOrder(q.items.length):q.w?shuffle([q.a,...q.w]):null}))};
  render();window.scrollTo(0,0)}

function qHTML(s,i){const q=s.qs[i],st=view.sa[i];let body='';
  const lab=`<span class="qlab">${i+1} · ${QLABEL[q.t]}</span>`;
  if(['mc','word','why','rf'].includes(q.t)){
    const right=q.t==='rf'?(q.a?'Richtig':'Falsch'):q.a;
    body=`<p class="qq">${q.t==='rf'?'„'+q.q+'“':q.q}</p><div class="choices${q.t==='rf'?'':' stack'}">${st.ch.map((c,k)=>{
      const cls=st.done&&c===right?'right':st.wrongs.includes(c)?'wrong':'';
      return `<button class="choice ${cls}" data-act="ch" data-i="${i}" data-v="${k}" ${st.done||st.wrongs.includes(c)?'disabled':''}>${c}</button>`}).join('')}</div>`}
  else if(q.t==='order'){
    body=st.done?`<p class="qq">Was passierte zuerst, was danach?</p><ol class="picked">${q.items.map(t=>`<li>${t}</li>`).join('')}</ol>`
    :`<p class="qq">Tippe die Sätze in der richtigen Reihenfolge an.</p>${st.pick.length?`<ol class="picked">${st.pick.map(k=>`<li>${q.items[k]}</li>`).join('')}</ol>`:''}
      <div class="choices stack">${st.ch.filter(k=>!st.pick.includes(k)).map(k=>`<button class="choice" data-act="op" data-i="${i}" data-k="${k}">${q.items[k]}</button>`).join('')}</div>
      <div class="btns">${st.pick.length===q.items.length?`<button class="btn" data-act="oc" data-i="${i}">Prüfen</button>`:''}${st.pick.length?`<button class="btn ghost" data-act="or" data-i="${i}">Neu beginnen</button>`:''}</div>`}
  else if(q.t==='gap'){
    body=`<p class="qq">Ergänze das fehlende Wort aus der Geschichte:</p><p class="qq gapline">${q.q.replace('___',st.done?`<span class="gap">${esc(q.a[0])}</span>`:'<span class="gap">&nbsp;?&nbsp;</span>')}</p>
    ${st.done?'':`<div class="row"><input class="ans" id="g${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(st.val)}" aria-label="Fehlendes Wort"><button class="btn" data-act="gc" data-i="${i}">Prüfen</button></div>`}`}
  else if(q.t==='write'){
    body=`<p class="qq">${q.q}</p>${st.done?`<p class="mine">${esc(st.val)}</p>`:`<textarea class="wr" id="w${i}" placeholder="Schreibe hier deinen Satz …" aria-label="Dein Satz">${esc(st.val)}</textarea><div class="btns"><button class="btn" data-act="ws" data-i="${i}">Speichern</button></div>`}`}
  return lab+body+st.msg}

function renderStory(){
  const s=curStory();
  app.innerHTML=`<button class="back" id="back">← Alle Geschichten</button>
  <article class="story"><h2 class="stitle">${s.title}</h2><p class="small muted" style="margin:0 0 14px">${minLbl()} · ${isEasy()?'leicht':'lang'} · Thema: ${s.theme}</p>
    ${isEasy()&&SAY.on?'<p class="tip-say">Lies zuerst allein. Wenn ein Satz schwierig ist, tippe darauf – dann hörst du ihn.</p>':''}
    <aside class="panel words"><h3>Wörter, die dir helfen</h3><dl>${(isEasy()?EASY[s.id].w:s.words).map(([w,e])=>`<div><dt>${w}</dt><dd>${e}</dd></div>`).join('')}</dl></aside>
    ${s.parts.map((p,pi)=>`<figure class="pic">${p.img()}</figure>`+(isEasy()?`<p class="read easy">${EASY[s.id].p[pi].map(t=>`<span class="sent"${SAY.on?' role="button" tabindex="0"':''}>${t}</span>`).join('')}</p>`:p.p.map(t=>`<p class="read">${t}</p>`).join(''))).join('')}
    <p class="end">Ende</p></article>
  <section class="qwrap"><h3 class="sec">Fragen zur Geschichte</h3><p class="small muted" style="margin-top:-4px">${s.qs.length-1} Fragen und ein eigener Satz. Du darfst im Text nachschauen!</p>
    ${s.qs.map((q,i)=>`<div class="panel sq" id="sq${i}">${qHTML(s,i)}</div>`).join('')}<div id="sum"></div></section>`;
  document.getElementById('back').onclick=()=>{view={screen:'list'};render();window.scrollTo(0,0)};
  app.onclick=storyClick;
  app.onkeydown=e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('g')){e.preventDefault();const b=e.target.parentNode.querySelector('[data-act="gc"]');if(b)b.click()}};
  updateSum(s);
}

function finishQ(st,ok,html){st.done=true;st.ok=ok;st.msg=fbx(ok?'ok':'no',html)}
function storyClick(e){const se=e.target.closest&&e.target.closest('.sent');if(se){say(se.textContent,se);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const s=curStory(),i=+b.dataset.i,q=s.qs[i],st=view.sa[i],act=b.dataset.act;if(st.done)return;
  if(act==='ch'){const c=st.ch[+b.dataset.v],right=q.t==='rf'?(q.a?'Richtig':'Falsch'):q.a;
    if(c===right)finishQ(st,true,'<strong>Richtig!</strong>');
    else{st.wrongs.push(c);st.tries++;if(q.t==='rf'||st.tries>=2)finishQ(st,false,`Die richtige Antwort ist: <strong>${right}</strong>. Lies die Stelle in der Geschichte nochmal.`);else st.msg=fbx('no','Noch nicht. Lies im Text nach und versuch es nochmal.')}}
  else if(act==='op'){st.pick.push(+b.dataset.k);st.msg=''}
  else if(act==='or'){st.pick=[]}
  else if(act==='oc'){if(st.pick.every((k,j)=>k===j))finishQ(st,true,'<strong>Richtig!</strong> Genau so war es.');
    else{st.tries++;if(st.tries>=2)finishQ(st,false,'So war die richtige Reihenfolge – oben siehst du sie.');else{st.pick=[];st.msg=fbx('no','Noch nicht ganz. Überlege: Was passierte ganz am Anfang?')}}}
  else if(act==='gc'){const v=document.getElementById('g'+i).value;st.val=v;
    if(!v.trim())st.msg=fbx('tip','Schreib zuerst ein Wort ins Feld.');
    else if(q.a.some(x=>norm(x)===norm(v)))finishQ(st,true,'<strong>Richtig!</strong>');
    else{st.tries++;if(st.tries>=2)finishQ(st,false,`Das fehlende Wort ist: <strong>${q.a[0]}</strong>.`);else st.msg=fbx('no','Noch nicht. Suche den Satz in der Geschichte.')}}
  else if(act==='ws'){const v=document.getElementById('w'+i).value.trim();st.val=v;
    if(v.split(/\s+/).filter(Boolean).length<4)st.msg=fbx('tip','Schreibe einen ganzen Satz mit mindestens 4 Wörtern.');
    else{store.writes.unshift({d:dkey(),id:s.id,q:q.q,text:v});store.writes=store.writes.slice(0,300);save();
      finishQ(st,true,`<strong>Gespeichert!</strong> Lies deinen Satz Mama oder Papa vor.<span class="why">So könnte man es auch sagen: „${q.m}“</span>`)}}
  const box=document.getElementById('sq'+i);box.innerHTML=qHTML(s,i);
  const inp=box.querySelector('input.ans');if(inp&&!st.done){inp.focus();inp.select()}
  updateSum(s);
}

function updateSum(s){
  const all=view.sa.every(x=>x.done),el=document.getElementById('sum');if(!el)return;
  if(!all){const n=view.sa.filter(x=>x.done).length;el.innerHTML=`<p class="small muted" style="text-align:center">${n} von ${s.qs.length} beantwortet</p>`;return}
  const scored=s.qs.map((q,i)=>[q,view.sa[i]]).filter(([q])=>q.t!=='write'),ok=scored.filter(([,x])=>x.ok).length,tot=scored.length;
  const min=Math.max(1,Math.round((Date.now()-view.t0)/60000));
  if(!view.saved){const k=dkey(),D=store.days[k]=store.days[k]||emptyDay();D.g={id:s.id,title:s.title,ok,all:tot,min,lvl:store.level};
    store.reads[s.id]={date:k,ok,all:tot};store.stars.lesen=(store.stars.lesen||0)+ok;save();view.saved=true;
    document.getElementById('total').textContent=total()}
  el.innerHTML=`<section class="panel done"><h3>Geschafft!</h3><p class="big3">${ok} von ${tot} richtig</p><p class="small muted">Lese- und Fragezeit: ca. ${min} Minuten · <span class="star">★</span> +${ok}</p>
    <p>${ok===tot?'Perfekt! Du hast ganz genau gelesen.':ok>=tot-2?'Sehr gut gelesen!':'Gut gemacht. Morgen geht es noch besser – lies die Geschichte ruhig nochmal.'}</p>
    <div class="btns"><button class="btn" id="tolist">Zurück zu den Geschichten</button></div></section>`;
  document.getElementById('tolist').onclick=()=>{view={screen:'list'};render();window.scrollTo(0,0)};
}

render();
</script>
</body>
</html>
